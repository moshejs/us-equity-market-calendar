name: Release

# Publishing a GitHub release (tag vX.Y.Z matching package.json) publishes to npm
# through npm Trusted Publishing (OIDC): no NPM_TOKEN secret, and every version gets
# a signed provenance attestation. One-time setup on npmjs.com:
# package settings -> Trusted Publisher -> GitHub Actions,
# repo moshejs/us-equity-market-calendar, workflow release.yml.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      # prepublishOnly runs typecheck, tests and build.
      - run: npm publish --provenance --access public
