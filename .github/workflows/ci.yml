name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit --incremental false
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Package exports and types (publint, are-the-types-wrong)
        if: matrix.node == 26
        run: |
          npx --yes publint@latest --strict
          npx --yes @arethetypeswrong/cli@latest --pack . --profile node16
      - uses: actions/upload-artifact@v4
        if: matrix.node == 26
        with:
          name: dist
          path: dist

  legacy-runtime:
    name: Built package runs on Node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/smoke-dist.cjs
